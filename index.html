<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>皮可敏明信片</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f0f4ec;
    --surface: #ffffff;
    --border: #d9e2cf;
    --text: #22301c;
    --text-muted: #5f6f57;
    --accent: #5a9c5a;
    --accent-strong: #3f7a41;
    --accent-soft: #e6f2e2;
    --gold: #c99a3b;
    --danger: #b3441f;
    --danger-soft: #fbe9e1;
    --good: #4c8c5a;
    --shadow: 0 1px 2px rgba(20, 30, 15, 0.06), 0 8px 24px -12px rgba(20, 30, 15, 0.2);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131a10;
      --surface: #1d2618;
      --border: #354430;
      --text: #eaf1e4;
      --text-muted: #a7b89d;
      --accent: #7fca7f;
      --accent-strong: #a3dba3;
      --accent-soft: #24331f;
      --gold: #e0b968;
      --danger: #e58a67;
      --danger-soft: #33231c;
      --good: #7fca90;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131a10; --surface: #1d2618; --border: #354430; --text: #eaf1e4;
    --text-muted: #a7b89d; --accent: #7fca7f; --accent-strong: #a3dba3;
    --accent-soft: #24331f; --gold: #e0b968; --danger: #e58a67; --danger-soft: #33231c; --good: #7fca90;
  }
  :root[data-theme="light"] {
    --bg: #f0f4ec; --surface: #ffffff; --border: #d9e2cf; --text: #22301c;
    --text-muted: #5f6f57; --accent: #5a9c5a; --accent-strong: #3f7a41;
    --accent-soft: #e6f2e2; --gold: #c99a3b; --danger: #b3441f; --danger-soft: #fbe9e1; --good: #4c8c5a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 64px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  header.top h1 {
    font-size: 20px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header.top h1::before { content: "🌸"; }
  .userbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
  .userbox img { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 9px;
    font-size: 14px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-strong); }
  .btn.secondary { background: transparent; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 14px;
  }

  /* ---- login ---- */
  #loginView {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
  }
  #loginView .emoji { font-size: 48px; }
  #loginView p { color: var(--text-muted); max-width: 320px; margin: 0; }
  #loginError { color: var(--danger); font-size: 13px; min-height: 18px; }

  /* ---- top controls + collapsible filter sidebar ---- */
  .top-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    position: sticky;
    top: 0;
    z-index: 26;
    background: var(--bg);
    padding-top: 4px;
  }
  .icon-btn {
    font-size: 18px;
    line-height: 1;
    padding: 8px 12px;
  }
  .toggle-group.vertical {
    flex-direction: column;
    align-items: stretch;
  }
  .toggle-group.vertical .toggle-btn { text-align: left; }
  .content-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  #filterSidebarCard { flex: 0 0 auto; width: 100%; }
  @media (max-width: 639px) {
    .content-row { flex-direction: column; }
    /* On phones the category list opens as a left-anchored overlay directly
       on top of the postcard grid (instead of pushing it down the page) —
       same width as the desktop sidebar, just floating over the grid
       instead of sitting beside it. Tapping ☰ again closes it. */
    #filterSidebarCard {
      position: fixed;
      top: var(--top-controls-h, 56px);
      left: 0;
      bottom: 0;
      z-index: 24;
      width: 240px;
      max-width: 85vw;
      margin: 0;
      border-radius: 0;
      overflow-y: auto;
    }
  }
  @media (min-width: 640px) {
    #filterSidebarCard { width: 240px; }
  }
  #allSection { flex: 1; min-width: 0; }
  .accordion-section {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .accordion-header {
    appearance: none;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border: none;
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .accordion-header:hover { color: var(--accent-strong); }
  .accordion-body { padding: 10px 12px; background: var(--bg); }
  .accordion-body select, .accordion-body input[type=text] {
    width: 100%; padding: 8px 9px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13.5px; font-family: inherit;
    box-sizing: border-box;
  }
  .accordion-body input[type=text] { margin-bottom: 8px; }

  .toggle-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .toggle-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-family: inherit;
    cursor: pointer;
  }
  .toggle-btn:hover { border-color: var(--accent); }
  .toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .tag-chip-row, .tag-suggest-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-chip-row:not(:empty) { margin-bottom: 8px; }
  .tag-suggest-row:not(:empty) { margin-top: 8px; }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    padding: 4px 6px 4px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .tag-chip button {
    appearance: none;
    border: none;
    background: rgba(0,0,0,0.15);
    color: inherit;
    border-radius: 50%;
    width: 16px; height: 16px;
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .tag-suggest-chip {
    appearance: none;
    font-size: 12.5px;
    padding: 4px 10px;
    border-radius: 999px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
  }
  .tag-suggest-chip:hover { border-color: var(--accent); color: var(--text); }

  .section-title { display: flex; align-items: center; gap: 8px; }
  .star-toggle {
    appearance: none;
    border: none;
    background: transparent;
    font-size: 20px;
    line-height: 1;
    padding: 2px;
    cursor: pointer;
    filter: grayscale(1);
    opacity: 0.45;
  }
  .star-toggle.active { filter: none; opacity: 1; }

  /* ---- postcard grids ---- */
  .grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(2, 1fr);
  }
  @media (min-width: 640px) {
    .grid-recent { grid-template-columns: repeat(3, 1fr); }
    .grid-all { grid-template-columns: repeat(3, 1fr); }
  }
  .grid-all {
    /* mobile: 2 columns x 3 rows before scrolling */
    max-height: 714px;
    overflow-y: auto;
    padding-right: 4px;
  }
  @media (min-width: 640px) {
    .grid-all {
      /* desktop: 3 columns x 3 rows before scrolling */
      max-height: 1136px;
    }
  }
  .pc-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--accent-soft);
    display: flex;
    flex-direction: column;
    position: relative;
    cursor: pointer;
  }
  .pc-card .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    background: var(--border);
    display: block;
  }
  .pc-card .meta {
    padding: 8px 9px;
    font-size: 12px;
    line-height: 1.5;
  }
  .pc-card .meta .loc { font-weight: 700; font-size: 18px; }
  .pc-card .meta .coord {
    color: var(--text-muted); font-variant-numeric: tabular-nums; word-break: break-all;
    font-size: 13px; cursor: pointer;
  }
  .pc-card .meta .coord:hover { text-decoration: underline; color: var(--accent-strong); }
  .pc-card .meta .note { color: var(--text-muted); margin-top: 3px; }
  .pc-card .meta .tags { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  .pc-card .tag {
    font-size: 10.5px;
    padding: 2px 6px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .pc-card .del-btn {
    position: absolute; top: 6px; right: 6px;
    width: 24px; height: 24px; border-radius: 50%;
    border: none; background: rgba(0,0,0,0.55); color: #fff;
    font-size: 13px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .pc-card .fav-btn {
    position: absolute; top: 6px; left: 6px;
    width: 26px; height: 26px; border-radius: 50%;
    border: none; background: rgba(0,0,0,0.45); color: #fff;
    font-size: 14px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    filter: grayscale(1); opacity: 0.75;
  }
  .pc-card .fav-btn.active { filter: none; opacity: 1; }
  .empty-hint { color: var(--text-muted); font-size: 13px; padding: 20px 4px; text-align: center; }

  .row-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

  /* ---- floating add button(s) ---- */
  .fab-group {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .fab {
    border-radius: 999px;
    padding: 14px 20px;
    font-weight: 700;
    box-shadow: 0 6px 18px -4px rgba(0,0,0,0.35);
  }

  /* ---- modal ---- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 15, 8, 0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
    padding: 0;
  }
  @media (min-width: 640px) {
    .modal-backdrop { align-items: center; padding: 20px; }
  }
  .modal {
    background: var(--surface);
    width: 100%;
    max-width: 480px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 20px;
  }
  @media (min-width: 640px) {
    .modal { border-radius: 16px; }
  }
  .modal h2 { margin-top: 0; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field input[type=text],
  .field input[type=file],
  .field select,
  .field textarea {
    width: 100%;
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .field textarea { min-height: 64px; resize: vertical; }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 22px 12px;
    text-align: center;
    cursor: pointer;
    background: var(--bg);
    transition: border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .dropzone .dz-icon { font-size: 26px; display: block; margin-bottom: 6px; }
  .dropzone .dz-text { font-size: 13px; color: var(--text-muted); }
  .dropzone .dz-text b { color: var(--accent-strong); }
  #photoInput { display: none; }
  .preview-wrap { position: relative; margin-top: 8px; display: none; }
  #photoPreview {
    max-width: 100%;
    max-height: 200px;
    border-radius: 9px;
    display: block;
    border: 1px solid var(--border);
  }
  .preview-wrap .remove-photo-btn {
    position: absolute; top: 6px; right: 6px;
    width: 24px; height: 24px; border-radius: 50%;
    border: none; background: rgba(0,0,0,0.55); color: #fff;
    font-size: 13px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .bulk-thumb-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .bulk-thumb {
    position: relative;
    flex: 0 0 auto;
    width: 72px;
    height: 72px;
    border-radius: 9px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg);
  }
  .bulk-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bulk-thumb .bulk-thumb-remove {
    position: absolute; top: 2px; right: 2px;
    width: 20px; height: 20px; border-radius: 50%;
    border: none; background: rgba(0,0,0,0.6); color: #fff;
    font-size: 11px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .upload-progress {
    display: none;
    margin-top: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .upload-progress .bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .15s ease-out;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions .btn { flex: 1; }
  #formMsg { font-size: 13px; min-height: 18px; margin-top: 8px; }
  #formMsg.err { color: var(--danger); }
  #formMsg.ok { color: var(--good); }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.5);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #configWarning {
    background: var(--danger-soft);
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="configWarning"></div>

  <div id="loginView">
    <div class="emoji">🌸🍄</div>
    <h1 style="margin:0;">皮可敏明信片</h1>
    <p>登入 Google 帳號,存放屬於你自己的明信片</p>
    <button class="btn primary" id="loginBtn">使用 Google 帳號繼續</button>
    <div id="loginError"></div>
  </div>

  <div id="appView" style="display:none">
    <header class="top">
      <h1>皮可敏明信片</h1>
      <div class="userbox">
        <img id="userAvatar" src="" alt="">
        <span id="userName"></span>
        <button class="btn secondary" id="logoutBtn">登出</button>
      </div>
    </header>

    <div class="top-controls">
      <button type="button" class="btn secondary icon-btn" id="sidebarToggleBtn" aria-label="分類篩選">☰</button>
      <button type="button" class="star-toggle" id="favToggleBtn" aria-label="只顯示珍藏">⭐</button>
      <div class="toggle-group">
        <button type="button" class="toggle-btn active" id="sortToggleBtn">近期上傳</button>
        <button type="button" class="toggle-btn" id="filterUneditedBtn">未編輯</button>
      </div>
    </div>

    <div class="content-row">
    <div class="card" id="filterSidebarCard" style="display:none">
      <aside class="filter-sidebar" id="filterSidebar">
        <div class="accordion-section">
          <button type="button" class="accordion-header" data-acc-target="accBodyLocation">地點</button>
          <div class="accordion-body" id="accBodyLocation" style="display:none">
            <div class="toggle-group vertical" id="locationOptionList">
              <button type="button" class="toggle-btn" data-value="">全部地點</button>
              <button type="button" class="toggle-btn" data-value="__uncat__">未歸類</button>
              <button type="button" class="toggle-btn" data-value="台灣">台灣</button>
              <button type="button" class="toggle-btn" data-value="亞洲">亞洲</button>
              <button type="button" class="toggle-btn" data-value="歐洲">歐洲</button>
              <button type="button" class="toggle-btn" data-value="非洲">非洲</button>
              <button type="button" class="toggle-btn" data-value="大洋洲">大洋洲</button>
              <button type="button" class="toggle-btn" data-value="北美洲">北美洲</button>
              <button type="button" class="toggle-btn" data-value="南美洲">南美洲</button>
              <button type="button" class="toggle-btn" data-value="南極洲">南極洲</button>
            </div>
          </div>
        </div>
        <div class="accordion-section">
          <button type="button" class="accordion-header" data-acc-target="accBodyPikmin">皮克敏</button>
          <div class="accordion-body" id="accBodyPikmin" style="display:none">
            <div class="toggle-group vertical" id="pikminOptionList">
              <button type="button" class="toggle-btn" data-value="">全部</button>
              <button type="button" class="toggle-btn" data-value="__uncat__">未歸類</button>
              <button type="button" class="toggle-btn" data-value="大頭照">大頭照</button>
              <button type="button" class="toggle-btn" data-value="1皮">1皮</button>
              <button type="button" class="toggle-btn" data-value="2皮">2皮</button>
              <button type="button" class="toggle-btn" data-value="3皮">3皮</button>
              <button type="button" class="toggle-btn" data-value="4皮">4皮</button>
              <button type="button" class="toggle-btn" data-value="5皮">5皮</button>
              <button type="button" class="toggle-btn" data-value="倒吊">倒吊</button>
            </div>
          </div>
        </div>
        <div class="accordion-section">
          <button type="button" class="accordion-header" data-acc-target="accBodyFloral">獲取方式</button>
          <div class="accordion-body" id="accBodyFloral" style="display:none">
            <div class="toggle-group vertical" id="floralOptionList">
              <button type="button" class="toggle-btn" data-value="">全部</button>
              <button type="button" class="toggle-btn" data-value="__uncat__">未歸類</button>
              <button type="button" class="toggle-btn" data-value="花點">花點</button>
              <button type="button" class="toggle-btn" data-value="菇點">菇點</button>
              <button type="button" class="toggle-btn" data-value="探險">探險</button>
            </div>
          </div>
        </div>
        <div class="accordion-section">
          <button type="button" class="accordion-header" data-acc-target="accBodyCustomTag">自定義標籤</button>
          <div class="accordion-body" id="accBodyCustomTag" style="display:none">
            <div class="tag-chip-row" id="filterCustomTagChips"></div>
            <select id="filterCustomTagSelect" style="margin-bottom:8px;">
              <option value="">選擇已建立的標籤</option>
            </select>
            <input type="text" id="filterCustomTagInput" placeholder="新增標籤分類">
            <button type="button" class="btn secondary" id="filterCustomTagAddBtn" style="margin-top:8px;">新增</button>
          </div>
        </div>
        <div class="accordion-section">
          <button type="button" class="accordion-header" data-acc-target="accBodyOther">寄送</button>
          <div class="accordion-body" id="accBodyOther" style="display:none">
            <div class="toggle-group vertical">
              <button type="button" class="toggle-btn" id="filterSentBtn">寄出</button>

<script>
(function () {
  // =====================================================================

  // =====================================================================
  const GOOGLE_CLIENT_ID = '944273011956-ljhjvloog70kotj32tqmpecoa5ce36fo.apps.googleusercontent.com';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file openid email profile';

  }

  const loginView = document.getElementById('loginView');
  const appView = document.getElementById('appView');

  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginError = document.getElementById('loginError');
  const userAvatar = document.getElementById('userAvatar');
  const userName = document.getElementById('userName');

  const allGrid = document.getElementById('allGrid');
  const allSection = document.getElementById('allSection');
  const topControls = document.querySelector('.top-controls');
  const favToggleBtn = document.getElementById('favToggleBtn');
  const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
  const filterSidebar = document.getElementById('filterSidebar');
  const filterSidebarCard = document.getElementById('filterSidebarCard');
  const sortToggleBtn = document.getElementById('sortToggleBtn');
  const filterUneditedBtn = document.getElementById('filterUneditedBtn');
  const locationOptionList = document.getElementById('locationOptionList');
  const pikminOptionList = document.getElementById('pikminOptionList');
  const floralOptionList = document.getElementById('floralOptionList');
  const filterSentBtn = document.getElementById('filterSentBtn');
  const filterReceivedBtn = document.getElementById('filterReceivedBtn');
  const filterCustomTagChips = document.getElementById('filterCustomTagChips');

  const bulkSelectedCount = document.getElementById('bulkSelectedCount');

  const bulkThumbStrip = document.getElementById('bulkThumbStrip');
  const uploadProgress = document.getElementById('uploadProgress');

  const sentBtn = document.getElementById('sentBtn');

  const customTagInput = document.getElementById('customTagInput');
  const customTagSelect = document.getElementById('customTagSelect');
  const customTagAddBtn = document.getElementById('customTagAddBtn');
  const nameFieldWrap = document.getElementById('nameFieldWrap');
  const coordFieldWrap = document.getElementById('coordFieldWrap');
  const nameInput = document.getElementById('nameInput');
  const nameOcrStatus = document.getElementById('nameOcrStatus');

  const addTagCtrl = makeTagChipController(customTagChips, customTagInput, null, customTagAddBtn, () => refreshTagSelect(customTagSelect, addTagCtrl));
  const editTagCtrl = makeTagChipController(editCustomTagChips, editCustomTagInput, null, editCustomTagAddBtn, () => refreshTagSelect(editCustomTagSelect, editTagCtrl));
  const filterTagCtrl = makeTagChipController(filterCustomTagChips, filterCustomTagInput, null, filterCustomTagAddBtn, () => renderAllGrid(), { declareOnly: true });
  const locationCtrl = makeMultiSelectButtonGroup(locationOptionList, () => renderAllGrid());
  const pikminCtrl = makeMultiSelectButtonGroup(pikminOptionList, () => renderAllGrid());
  const floralCtrl = makeMultiSelectButtonGroup(floralOptionList, () => renderAllGrid());
  wireTagSelect(filterCustomTagSelect, filterTagCtrl, () => renderAllGrid());
  wireTagSelect(customTagSelect, addTagCtrl);
  wireTagSelect(editCustomTagSelect, editTagCtrl);

  let accessToken = null;
  let currentUser = null;
  let tokenClient = null;
  let pendingPhotoBlob = null;
  let pendingBulkFiles = [];
  let allPostcardsCache = []; // last full list fetched from Drive, used for client-side filtering

  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }

  // Normalizes a "座標" entry to "緯度,經度" with exactly 6 decimal places.
  // Strips wrapping brackets, converts stray Chinese numerals (a common typo
  // when an IME is still active, e.g. "18.7662一二" meaning "18.766212")
  // back into digits, then validates. Returns { value, error } — value is
  // null when the text can't be salvaged into two real numbers.
  function normalizeCoords(raw) {
    const s0 = String(raw ?? '').trim();
    if (!s0) return { value: '', error: null };
    let s = s0.replace(/^[\(\[【]/, '').replace(/[\)\]】]$/, '').trim();
    const cnDigits = { '零': '0', '一': '1', '二': '2', '三': '3', '四': '4', '五': '5', '六': '6', '七': '7', '八': '8', '九': '9' };
    s = s.replace(/[零一二三四五六七八九]/g, ch => cnDigits[ch]);
    const parts = s.split(/[,,]/).map(p => p.trim());
    if (parts.length !== 2) {
      return { value: null, error: '座標格式錯誤,需要「緯度,經度」兩個數字(用逗號分隔)' };
    }
    const [latRaw, lonRaw] = parts;
    if (!/^-?\d+(\.\d+)?$/.test(latRaw) || !/^-?\d+(\.\d+)?$/.test(lonRaw)) {
      return { value: null, error: '座標包含無法辨識的文字,請確認後手動修正' };
    }
    const lat = parseFloat(latRaw), lon = parseFloat(lonRaw);
    if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
      return { value: null, error: '座標數值超出範圍(緯度 -90~90,經度 -180~180)' };
    }
    return { value: lat.toFixed(6) + ',' + lon.toFixed(6), error: null };
  }

  // Every custom tag ever typed (across all postcards) becomes a reusable
  // suggestion — once you've created one, you can just click it next time
  // instead of retyping it. Tags declared straight from the sidebar filter
  // (before any postcard actually uses them yet) used to live in
  // localStorage, but that's per-browser/per-device — a tag declared on
  // your phone would never show up on the desktop site. They're now kept in
  // a small config file in the same Google Drive the postcards live in, so
  // logging in on any device sees the same list.
  const LEGACY_DECLARED_TAGS_KEY = 'pikminPostcardsDeclaredTags';
  let configFileId = null;
  let declaredTagsCache = [];

  async function driveLoadConfig() {
    try {
      const q = `appProperties has { key='app' and value='${APP_TAG}' } and appProperties has { key='configType' and value='appConfig' } and trashed=false`;
      const url = `${DRIVE_API}/files?q=${encodeURIComponent(q)}&fields=files(id)&pageSize=20`;
      const res = await fetch(url, { headers: driveHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      const files = data.files || [];
      if (files.length === 0) { configFileId = null; declaredTagsCache = []; return; }
      // Two tags declared back-to-back — on this device or another — before
      // configFileId was known could each take the "create a new file"
      // branch below, leaving tags split across more than one config file.
      // Merge every matching file's tags together so none of them look like
      // they "disappeared", and keep the first as the one this device
      // writes back to from now on.
      const allTags = new Set();
      for (const file of files) {
        try {
          const contentRes = await fetch(`${DRIVE_API}/files/${file.id}?alt=media`, { headers: driveHeaders() });
          if (!contentRes.ok) continue;
          const config = await contentRes.json().catch(() => ({}));
          (Array.isArray(config.declaredTags) ? config.declaredTags : []).forEach(t => allTags.add(t));
        } catch (e) { /* skip this one, still have the rest */ }
      }
      configFileId = files[0].id;
      declaredTagsCache = Array.from(allTags).sort();
      if (files.length > 1) await driveSaveConfig(); // consolidate the merge back into the primary file
    } catch (e) { /* config load failed — known tags still work via postcards already in use */ }
  }

  // Saves are queued one at a time (never run concurrently on this device)
  // and each one re-reads the server's current tags immediately before
  // writing, merging them into declaredTagsCache first. Without this, two
  // tags declared back-to-back — before the first save's response even came
  // back — could each see configFileId as still null and both create their
  // own config file; and a device that had been logged in for hours would
  // blindly overwrite whatever another device saved in the meantime with its
  // own stale in-memory list, making the other device's tag vanish on
  // refresh.
  let configSaveChain = Promise.resolve();
  function driveSaveConfig() {
    configSaveChain = configSaveChain.then(driveSaveConfigSerialized).catch(() => {});
    return configSaveChain;
  }
  async function driveSaveConfigSerialized() {
    try {
      if (configFileId) {
        const contentRes = await fetch(`${DRIVE_API}/files/${configFileId}?alt=media`, { headers: driveHeaders() });
        if (contentRes.ok) {
          const serverConfig = await contentRes.json().catch(() => ({}));
          const serverTags = Array.isArray(serverConfig.declaredTags) ? serverConfig.declaredTags : [];
          declaredTagsCache = Array.from(new Set([...serverTags, ...declaredTagsCache])).sort();
        }
      }
      const body = JSON.stringify({ declaredTags: declaredTagsCache });
      if (configFileId) {
        await fetch(`${DRIVE_UPLOAD_API}/files/${configFileId}?uploadType=media`, {
          method: 'PATCH',
          headers: driveHeaders({ 'Content-Type': 'application/json' }),
          body
        });
      } else {
        const boundary = 'pikmin_boundary_' + Date.now();
        const metadataPart = JSON.stringify({
          name: 'pikmin_postcards_config.json',
          appProperties: { app: APP_TAG, configType: 'appConfig' }
        });
        const multipartBody =
          `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadataPart}\r\n` +
          `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n` +
          `--${boundary}--`;
        const res = await fetch(`${DRIVE_UPLOAD_API}/files?uploadType=multipart&fields=id`, {
          method: 'POST',
          headers: driveHeaders({ 'Content-Type': `multipart/related; boundary=${boundary}` }),
          body: multipartBody
        });
        const data = await res.json().catch(() => null);
        if (data && data.id) configFileId = data.id;
      }
      refreshTagSelect(filterCustomTagSelect, filterTagCtrl);
      refreshTagSelect(customTagSelect, addTagCtrl);
      refreshTagSelect(editCustomTagSelect, editTagCtrl);
    } catch (e) { /* best-effort sync — the tag still works locally this session either way */ }
  }

  // One-time cleanup for anyone who declared tags before this was synced —
  // folds whatever was stuck in this device's localStorage into the shared
  // Drive config, then stops using localStorage for this going forward.
  async function migrateLegacyLocalDeclaredTags() {
    let legacy = [];
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_DECLARED_TAGS_KEY) || '[]'); } catch (e) { /* ignore */ }
    if (legacy.length === 0) return;
    let changed = false;
    legacy.forEach(t => { if (!declaredTagsCache.includes(t)) { declaredTagsCache.push(t); changed = true; } });
    if (changed) await driveSaveConfig();
    try { localStorage.removeItem(LEGACY_DECLARED_TAGS_KEY); } catch (e) { /* ignore */ }
  }

  // Every login reconciles this device's view of custom tags against the
  // shared Drive config, rather than trusting the config blindly: tags this
  // device actually has in use (on its postcards, already loaded by this
  // point) that the config doesn't know about yet — e.g. from a previous
  // save that raced with another device's — get folded in and written back.
  // A device with fewer tags than the config just ends up adopting the
  // union, since the union is never smaller than either side.
  async function reconcileDeclaredTags() {
    const inUse = Array.from(new Set(allPostcardsCache.flatMap(p => p.customTags || [])));
    const merged = Array.from(new Set([...declaredTagsCache, ...inUse])).sort();
    const hasNew = merged.some(t => !declaredTagsCache.includes(t));
    declaredTagsCache = merged;
    if (hasNew) await driveSaveConfig();
  }

  function getDeclaredCustomTags() {
    return declaredTagsCache;
  }
  function declareCustomTag(tag) {
    if (!declaredTagsCache.includes(tag)) {
      declaredTagsCache.push(tag);
      driveSaveConfig(); // fire-and-forget so the UI doesn't wait on this
      refreshTagSelect(filterCustomTagSelect, filterTagCtrl);
      refreshTagSelect(customTagSelect, addTagCtrl);
      refreshTagSelect(editCustomTagSelect, editTagCtrl);
    }
  }
  function getAllKnownCustomTags() {
    return Array.from(new Set([
      ...allPostcardsCache.flatMap(p => p.customTags || []),
      ...getDeclaredCustomTags()
    ])).sort();
  }

  // Drives one postcard's tag-chip input: an always-visible list of chips
  // already added (each removable), a text box that adds a new chip on
  // Enter, and a row of previously-used tags you can click to reuse instead
  // of retyping.
  function makeTagChipController(chipsEl, inputEl, suggestEl, addBtnEl, onChange, opts) {
    const declareOnly = !!(opts && opts.declareOnly);
    let tags = [];
    function render() {
      chipsEl.innerHTML = tags.map((t, i) =>
        `<span class="tag-chip">${escapeHtml(t)}<button type="button" data-remove-tag="${i}" aria-label="移除">✕</button></span>`
      ).join('');
      if (suggestEl) {
        const known = getAllKnownCustomTags().filter(t => !tags.includes(t));
        suggestEl.innerHTML = known.map(t =>
          `<button type="button" class="tag-suggest-chip" data-pick-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`
        ).join('');
      }
    }
    function addFromInput() {
      const v = inputEl.value.trim();
      inputEl.value = '';
      if (!v) return;
      // The sidebar filter's input is for pre-declaring a brand-new tag so
      // it becomes pickable everywhere — typing one there shouldn't also
      // turn it into an active filter (declareCustomTag already refreshes
      // every dropdown, including this one, on its own).
      if (declareOnly) { declareCustomTag(v); return; }
      if (!tags.includes(v)) { tags.push(v); declareCustomTag(v); render(); if (onChange) onChange(); }
    }
    chipsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-remove-tag]');
      if (!btn) return;
      tags.splice(parseInt(btn.getAttribute('data-remove-tag'), 10), 1);
      render();
      if (onChange) onChange();
    });
    if (suggestEl) {
      suggestEl.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-pick-tag]');
        if (!btn) return;
        const t = btn.getAttribute('data-pick-tag');
        if (!tags.includes(t)) { tags.push(t); render(); if (onChange) onChange(); }
      });
    }
    inputEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      addFromInput();
    });
    // Explicit "新增" button — mobile keyboards don't reliably surface/fire
    // an Enter key the same way a physical keyboard does, so touch users
    // need a tappable way to commit the tag they just typed.
    if (addBtnEl) addBtnEl.addEventListener('click', addFromInput);
    return {
      get: () => tags.slice(),
      set: (arr) => { tags = Array.isArray(arr) ? [...arr] : []; render(); },
      refresh: render
    };
  }

  // Radio-style button group for a single-value filter (地點/皮克敏/獲取方式) —
  // clicking an option selects it exclusively within the group; clicking the
  // already-active option clears back to "全部".
  // "全部" (value="") acts as a reset for the category — picking it clears
  // every other selection, and picking any real value cancels "全部". Aside
  // from that, any number of the remaining options can be active together
  // (OR'd when filtering).
  function makeMultiSelectButtonGroup(containerEl, onChange) {
    const selected = new Set();
    function apply() {
      [...containerEl.querySelectorAll('[data-value]')].forEach(b => {
        b.classList.toggle('active', selected.has(b.getAttribute('data-value')));
      });
    }
    containerEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-value]');
      if (!btn) return;
      const v = btn.getAttribute('data-value');
      if (v === '') {
        selected.clear();
      } else {
        selected.delete('');
        if (selected.has(v)) selected.delete(v); else selected.add(v);
      }
      apply();
      onChange();
    });
    return {
      get: () => [...selected],
      set: (arr) => { selected.clear(); (arr || []).forEach(v => selected.add(v)); apply(); }
    };
  }

  // ---- Google Identity Services setup ----
  function initGis() {
    if (!isConfigured || typeof google === 'undefined' || !google.accounts) return;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: async (tokenResponse) => {
        if (tokenResponse.error) {
          loginError.textContent = '登入失敗: ' + tokenResponse.error;
          return;
        }
        accessToken = tokenResponse.access_token;
        saveCachedToken(tokenResponse.access_token, tokenResponse.expires_in);
        try {
          await onLoginSuccess();
        } catch (err) {
          loginError.textContent = '登入後讀取帳號資料失敗: ' + (err.message || err);
        }
      }
    });
  }
  // google's script is loaded with defer, so poll briefly until it's ready
  (function waitForGis(tries) {
    if (typeof google !== 'undefined' && google.accounts) { initGis(); return; }
    if (tries <= 0) return;
    setTimeout(() => waitForGis(tries - 1), 200);
  })(25);

  // ---- resume a still-valid session on this device without a fresh login ----
  // Google's token client always needs a popup to grant a new access token
  // (even with prompt:''), so a truly silent re-auth on page load isn't
  // reliable — browsers block the popup since it isn't tied to a click.
  // Instead cache the token locally and just skip the login screen while it's
  // still valid, matching real device-session behavior for this hour.
  const TOKEN_CACHE_KEY = 'pikminPostcardsToken';
  function saveCachedToken(token, expiresInSec) {
    try {
      localStorage.setItem(TOKEN_CACHE_KEY, JSON.stringify({
        access_token: token,
        expires_at: Date.now() + (expiresInSec || 3600) * 1000
      }));
    } catch (e) { /* localStorage unavailable (e.g. private mode) — just skip caching */ }
  }
  function clearCachedToken() {
    try { localStorage.removeItem(TOKEN_CACHE_KEY); } catch (e) { /* ignore */ }
  }
  function tryResumeCachedSession() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(TOKEN_CACHE_KEY) || 'null'); } catch (e) { saved = null; }
    if (!saved || !saved.access_token || !saved.expires_at) return;
    if (Date.now() >= saved.expires_at - 30000) { clearCachedToken(); return; }
    accessToken = saved.access_token;
    onLoginSuccess().catch(() => {
      // cached token no longer works (revoked/expired) — fall back to the login screen
      accessToken = null;
      clearCachedToken();
    });
  }
  tryResumeCachedSession();

  loginBtn.addEventListener('click', () => {
    loginError.textContent = '';
    if (!isConfigured) {
      loginError.textContent = '尚未設定 Google OAuth Client ID,無法登入。';
      return;
    }
    if (!tokenClient) {
      loginError.textContent = 'Google 登入元件尚未載入完成,請稍後再試一次。';
      return;
    }
    tokenClient.requestAccessToken({ prompt: 'select_account' });
  });

  logoutBtn.addEventListener('click', () => {
    if (accessToken && typeof google !== 'undefined' && google.accounts) {
      google.accounts.oauth2.revoke(accessToken, () => {});
    }
    accessToken = null;
    currentUser = null;
    allPostcardsCache = [];
    clearCachedToken();
    loginView.style.display = '';
    appView.style.display = 'none';
    addBtn.style.display = 'none';
  });

  async function onLoginSuccess() {
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + accessToken }
    });
    if (!res.ok) throw new Error('無法取得帳號資料 (' + res.status + ')');
    const profile = await res.json();
    currentUser = profile;
    loginView.style.display = 'none';
    appView.style.display = '';
    addBtn.style.display = '';
    userAvatar.src = profile.picture || '';
    userName.textContent = profile.name || profile.email || '';
    await loadPostcards();
    await driveLoadConfig();
    await reconcileDeclaredTags();
    await migrateLegacyLocalDeclaredTags();
    filterTagCtrl.refresh();
    refreshTagSelect(filterCustomTagSelect, filterTagCtrl);
    refreshTagSelect(customTagSelect, addTagCtrl);
    refreshTagSelect(editCustomTagSelect, editTagCtrl);
    restoreEditDraftIfAny();
  }

  // ---- Drive API helpers ----
  function driveHeaders(extra) {
    return Object.assign({ Authorization: 'Bearer ' + accessToken }, extra || {});
  }

  async function handleDriveError(res, action) {
    if (res.status === 401) {
      accessToken = null;
      clearCachedToken();
      throw new Error('登入已過期,請重新登入後再' + action + '。');
    }
    const text = await res.text().catch(() => '');
    if (res.status === 403 && /insufficient/i.test(text)) {
      // A cached token issued before the Drive scope was granted keeps
      // failing the same way forever unless we drop it here — same recovery
      // path as an expired token, just triggered by a permissions mismatch
      // instead of time.
      accessToken = null;
      clearCachedToken();
      throw new Error('登入已過期,請重新登入後再' + action + '(這次的登入權限不足,可能是舊的登入紀錄)。');
    }
    throw new Error(action + '失敗 (' + res.status + ')' + (text ? ': ' + text.slice(0, 200) : ''));
  }

  async function driveListPostcards() {
    const q = `appProperties has { key='app' and value='${APP_TAG}' } and trashed=false`;
    const fields = 'files(id,name,createdTime,appProperties,description)';
    const url = `${DRIVE_API}/files?q=${encodeURIComponent(q)}&orderBy=createdTime desc&fields=${encodeURIComponent(fields)}&pageSize=1000`;
    const res = await fetch(url, { headers: driveHeaders() });
    if (!res.ok) return handleDriveError(res, '讀取明信片清單');
    const data = await res.json();
    // The shared config file is tagged with the same app marker so it can be
    // found for load/save, but it's not a postcard — exclude it here or it
    // shows up as one blank card (no name/location/tags/photo) in the grid.
    return (data.files || []).filter(f => (f.appProperties || {}).configType !== 'appConfig').map(f => {
      let extra = {};
      try { extra = JSON.parse(f.description || '{}'); } catch (e) { /* ignore malformed description */ }
      const props = f.appProperties || {};
      return {
        id: f.id,
        createdTime: f.createdTime,
        name: props.pcName || '',
        location: props.location || '',
        pikmin: props.pikmin || '',
        floral: props.floral || '',
        sent: props.sent === 'true',
        received: props.received === 'true',
        favorite: props.favorite === 'true',
        customTags: (props.customTag || '').split('|').map(s => s.trim()).filter(Boolean),
        coords: extra.coords || '',
        notes: extra.notes || ''
      };
    });
  }

  async function driveFetchImageBlobUrl(fileId) {
    const res = await fetch(`${DRIVE_API}/files/${fileId}?alt=media`, { headers: driveHeaders() });
    if (!res.ok) return handleDriveError(res, '讀取照片');
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }

  // Uses XHR (not fetch) so upload progress can be reported via onprogress —
  // fetch has no cross-browser request-upload-progress event.
  function driveUploadPostcard(fileBlob, meta, onProgress) {
    const boundary = 'pikmin_boundary_' + Date.now();
    const metadataPart = JSON.stringify({
      name: `postcard_${Date.now()}.jpg`,
      appProperties: {
        app: APP_TAG, pcName: String(meta.name || '').slice(0, 100),
        location: meta.location, pikmin: meta.pikmin, floral: meta.floral,
        sent: String(!!meta.sent), received: String(!!meta.received), favorite: String(!!meta.favorite),
        customTag: String(meta.customTag || '').slice(0, 300)
      },
      description: JSON.stringify({ coords: meta.coords, notes: meta.notes })
    });

    const head = new Blob([
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadataPart}\r\n`,
      `--${boundary}\r\nContent-Type: image/jpeg\r\n\r\n`
    ], { type: 'text/plain' });
    const tail = new Blob([`\r\n--${boundary}--`], { type: 'text/plain' });
    const multipartBody = new Blob([head, fileBlob, tail]);

    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `${DRIVE_UPLOAD_API}/files?uploadType=multipart&fields=id`);
      xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
      xhr.setRequestHeader('Content-Type', `multipart/related; boundary=${boundary}`);
      if (onProgress) {
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
        };
      }
      xhr.onload = () => {
        if (xhr.status === 401) {
          accessToken = null;
          reject(new Error('登入已過期,請重新登入後再上傳。'));
        } else if (xhr.status >= 200 && xhr.status < 300) {
          resolve(JSON.parse(xhr.responseText));
        } else {
          reject(new Error('上傳失敗 (' + xhr.status + '): ' + xhr.responseText.slice(0, 200)));
        }
      };
      xhr.onerror = () => reject(new Error('上傳失敗: 網路錯誤'));
      xhr.send(multipartBody);
    });
  }

  async function driveUpdatePostcardMeta(fileId, meta) {
    const res = await fetch(`${DRIVE_API}/files/${fileId}`, {
      method: 'PATCH',
      headers: driveHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        appProperties: {
          app: APP_TAG, pcName: String(meta.name || '').slice(0, 100),
          location: meta.location, pikmin: meta.pikmin, floral: meta.floral,
          sent: String(!!meta.sent), received: String(!!meta.received), favorite: String(!!meta.favorite),
          customTag: String(meta.customTag || '').slice(0, 300)
        },
        description: JSON.stringify({ coords: meta.coords, notes: meta.notes })
      })
    });
    if (!res.ok) return handleDriveError(res, '更新');
    return res.json();
  }

  async function driveDeletePostcard(fileId) {
    const res = await fetch(`${DRIVE_API}/files/${fileId}`, { method: 'DELETE', headers: driveHeaders() });
    if (!res.ok && res.status !== 404) return handleDriveError(res, '刪除');
  }

  // ---- rendering ----
  function skeletonCardHtml(pc) {
    const tags = [];
    if (pc.location) tags.push(`<span class="tag">${escapeHtml(pc.location)}</span>`);
    if (pc.pikmin) tags.push(`<span class="tag">${escapeHtml(pc.pikmin)}</span>`);
    if (pc.floral) tags.push(`<span class="tag">${escapeHtml(pc.floral)}</span>`);
    if (pc.sent) tags.push(`<span class="tag">已寄出</span>`);
    if (pc.received) tags.push(`<span class="tag">已收到</span>`);
    (pc.customTags || []).forEach(t => tags.push(`<span class="tag">${escapeHtml(t)}</span>`));
    return `
      <div class="pc-card" data-id="${escapeHtml(pc.id)}">
        <button class="fav-btn${pc.favorite ? ' active' : ''}" type="button" data-fav="${escapeHtml(pc.id)}" aria-label="切換珍藏">⭐</button>
        <button class="del-btn" type="button" data-del="${escapeHtml(pc.id)}" aria-label="刪除">✕</button>
        <img class="thumb" data-photo-for="${escapeHtml(pc.id)}" alt="明信片" src="">
        <div class="meta">
          <div class="loc">${escapeHtml(pc.name || '')}</div>
          <div class="coord" data-coord="${escapeHtml(pc.coords || '')}">${escapeHtml(pc.coords || '未填座標')}</div>
          <div class="tags">${tags.join('')}</div>
        </div>
      </div>
    `;
  }

  // fetch+attach each thumbnail image asynchronously after the grid skeleton
  // is on screen, so the list itself doesn't wait on every image download.
  function hydrateThumbnails(container, list) {
    list.forEach(pc => {
      driveFetchImageBlobUrl(pc.id).then(url => {
        const img = container.querySelector(`img[data-photo-for="${CSS.escape(pc.id)}"]`);
        if (img) img.src = url;
      }).catch(() => {
        const img = container.querySelector(`img[data-photo-for="${CSS.escape(pc.id)}"]`);
        if (img) img.alt = '照片載入失敗';
      });
    });
  }

  // No more separate "home" page — the all-postcards list (filterable +
  // sortable) is the one and only view shown after login.
  let onlyFavorites = false;
  let sortDirection = 'desc'; // 'asc' = 最早到最晚, 'desc' = 最晚到最早

  function emptyGridHintHtml() {
    // Brand-new account with zero postcards at all — give a direct button
    // rather than just pointing at the floating action button elsewhere.
    if (allPostcardsCache.length === 0) {
      return `<div class="empty-hint"><button type="button" class="btn primary" id="emptyAddBtn">＋ 存入明信片</button></div>`;
    }
    return `<div class="empty-hint">沒有符合篩選條件的明信片。</div>`;
  }

  async function loadPostcards() {
    allGrid.innerHTML = `<div class="empty-hint">載入中...</div>`;
    try {
      allPostcardsCache = await driveListPostcards();
    } catch (err) {
      allGrid.innerHTML = `<div class="empty-hint">${escapeHtml(err.message || err)}</div>`;
      if (String(err.message).includes('登入已過期')) doForceLogout();
      return;
    }
    renderAllGrid();
  }

  const UNCAT = '__uncat__';
  // Each category can now have multiple options selected at once (OR within
  // the category) — an empty selection means "no filter" for that category.
  function matchField(value, selectedValues) {
    if (!selectedValues || selectedValues.length === 0) return true;
    return selectedValues.some(v => v === UNCAT ? !value : value === v);
  }
  // A postcard counts as "未編輯" when it's still exactly as bulk-upload
  // left it — nothing filled in and no status toggled — which is broader
  // than the old "未歸類" (location/pikmin/獲取方式 blank) check it replaces.
  function isUnedited(p) {
    return !p.location && !p.pikmin && !p.floral && !p.name && !p.coords && !p.notes &&
      !(p.customTags && p.customTags.length) && !p.sent && !p.received && !p.favorite;
  }
  function applyFilters(list) {
    const fLoc = locationCtrl.get(), fPik = pikminCtrl.get(), fFlo = floralCtrl.get();
    const fSent = filterSentBtn.classList.contains('active');
    const fReceived = filterReceivedBtn.classList.contains('active');
    const fUnedited = filterUneditedBtn.classList.contains('active');
    const fCustomTags = filterTagCtrl.get();
    return list.filter(p =>
      (!onlyFavorites || p.favorite) &&
      matchField(p.location, fLoc) &&
      matchField(p.pikmin, fPik) &&
      matchField(p.floral, fFlo) &&
      (!fSent || p.sent) &&
      (!fReceived || p.received) &&
      (!fUnedited || isUnedited(p)) &&
      (!fCustomTags.length || fCustomTags.some(t => (p.customTags || []).includes(t)))
    );
  }

  // Primary sort is upload time (direction picked via the two sort buttons);
  // a batch upload lands a whole group of postcards on the same timestamp,
  // so ties fall back to sorting by name A→Z.
  function sortPostcards(list) {
    return list.slice().sort((a, b) => {
      const ta = new Date(a.createdTime).getTime();
      const tb = new Date(b.createdTime).getTime();
      if (ta !== tb) return sortDirection === 'asc' ? ta - tb : tb - ta;
      return (a.name || '').localeCompare(b.name || '');
    });
  }

  // Quick-pick dropdown alongside each chip UI (sidebar filter, add form, edit
  // form) — handy once there are enough known tags that scrolling through
  // suggestion chips gets tedious. Shared by all three contexts so a tag
  // declared anywhere immediately becomes pickable everywhere.
  function refreshTagSelect(selectEl, ctrl) {
    const known = getAllKnownCustomTags();
    selectEl.innerHTML = '<option value="">選擇已建立的標籤</option>' +
      known.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  }
  function wireTagSelect(selectEl, ctrl, afterPick) {
    selectEl.addEventListener('change', () => {
      const v = selectEl.value;
      selectEl.value = '';
      if (!v) return;
      const current = ctrl.get();
      if (!current.includes(v)) ctrl.set([...current, v]);
      refreshTagSelect(selectEl, ctrl);
      if (afterPick) afterPick();
    });
  }

  function renderAllGrid() {
    filterTagCtrl.refresh();
    refreshTagSelect(filterCustomTagSelect, filterTagCtrl);
    const list = sortPostcards(applyFilters(allPostcardsCache));
    if (list.length === 0) {
      allGrid.innerHTML = emptyGridHintHtml();
      return;
    }
    allGrid.innerHTML = list.map(skeletonCardHtml).join('');
    hydrateThumbnails(allGrid, list);
  }

  favToggleBtn.addEventListener('click', () => {
    onlyFavorites = !onlyFavorites;
    favToggleBtn.classList.toggle('active', onlyFavorites);
    renderAllGrid();
  });

  sortToggleBtn.addEventListener('click', () => {
    if (sortDirection === 'desc') {
      sortDirection = 'asc';
      sortToggleBtn.textContent = '最早上傳';
    } else {
      sortDirection = 'desc';
      sortToggleBtn.textContent = '近期上傳';
    }
    renderAllGrid();
  });
  filterUneditedBtn.addEventListener('click', () => {
    filterUneditedBtn.classList.toggle('active');
    renderAllGrid();
  });

  // The mobile sidebar overlay is anchored below wherever the top-controls
  // bar (☰/⭐/近期上傳/未編輯) currently renders, rather than at the very top
  // of the viewport — otherwise that bar, being higher z-index so it stays
  // clickable, would sit on top of and hide the sidebar's own top edge.
  // Before the page scrolls, the bar sits below the header in normal flow;
  // once scrolled past the header it becomes pinned (position: sticky) at
  // the very top instead — so its rendered bottom edge is tracked live via
  // scroll/resize rather than measured once.
  let topControlsSyncQueued = false;
  function syncTopControlsHeight() {
    if (topControlsSyncQueued) return;
    topControlsSyncQueued = true;
    requestAnimationFrame(() => {
      topControlsSyncQueued = false;
      const bottom = Math.max(0, topControls.getBoundingClientRect().bottom);
      document.documentElement.style.setProperty('--top-controls-h', bottom + 'px');
    });
  }
  syncTopControlsHeight();
  window.addEventListener('resize', syncTopControlsHeight);
  window.addEventListener('scroll', syncTopControlsHeight, { passive: true });

  sidebarToggleBtn.addEventListener('click', () => {
    filterSidebarCard.style.display = filterSidebarCard.style.display === 'none' ? '' : 'none';
    syncTopControlsHeight();
  });
  filterSidebar.addEventListener('click', (e) => {
    const header = e.target.closest('.accordion-header');
    if (!header) return;
    const body = document.getElementById(header.getAttribute('data-acc-target'));
    if (!body) return;
    body.style.display = body.style.display === 'none' ? '' : 'none';
  });

  // Google access tokens can't be extended past Google's own ~1hr limit, so
  // instead: if a forced logout happens while the add/edit modal is open,
  // save the in-progress field values (not the photo — blobs don't survive
  // localStorage) and restore them into a reopened modal after the next
  // successful login, so the user doesn't lose what they'd typed.
  const EDIT_DRAFT_KEY = 'pikminPostcardsEditDraft';
  function saveEditDraft() {
    try {
      if (addModalBackdrop.style.display === 'flex') {
        localStorage.setItem(EDIT_DRAFT_KEY, JSON.stringify({
          mode: 'add',
          name: nameInput.value,
          location: document.getElementById('locationSelect').value,
          pikmin: document.getElementById('pikminSelect').value,
          floral: document.getElementById('pointTypeSelect').value,
          sent: sentBtn.classList.contains('active'),
          received: receivedBtn.classList.contains('active'),
          favorite: favoriteBtn.classList.contains('active'),
          customTags: addTagCtrl.get(),
          coords: document.getElementById('coordInput').value,
          notes: document.getElementById('notesInput').value
        }));
      } else if (editModalBackdrop.style.display === 'flex' && editingId) {
        localStorage.setItem(EDIT_DRAFT_KEY, JSON.stringify({
          mode: 'edit',
          editingId,
          name: editNameInput.value,
          location: editLocationSelect.value,
          pikmin: editPikminSelect.value,
          floral: editPointTypeSelect.value,
          sent: editSentBtn.classList.contains('active'),
          received: editReceivedBtn.classList.contains('active'),
          favorite: editFavoriteBtn.classList.contains('active'),
          customTags: editTagCtrl.get(),
          coords: editCoordInput.value,
          notes: editNotesInput.value
        }));
      }
    } catch (e) { /* localStorage unavailable — draft just won't survive */ }
  }
  function loadEditDraft() {
    try { return JSON.parse(localStorage.getItem(EDIT_DRAFT_KEY) || 'null'); } catch (e) { return null; }
  }
  function clearEditDraft() {
    try { localStorage.removeItem(EDIT_DRAFT_KEY); } catch (e) { /* ignore */ }
  }
  function restoreEditDraftIfAny() {
    const draft = loadEditDraft();
    if (!draft) return;
    clearEditDraft();
    if (draft.mode === 'add') {
      openAddModal();
      nameInput.value = draft.name || '';
      document.getElementById('locationSelect').value = draft.location || '';
      document.getElementById('pikminSelect').value = draft.pikmin || '';
      document.getElementById('pointTypeSelect').value = draft.floral || '';
      sentBtn.classList.toggle('active', !!draft.sent);

  function resizeImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('圖片處理失敗')), 'image/jpeg', quality);
        };
        img.onerror = () => reject(new Error('圖片無法讀取'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('檔案讀取失敗'));
      reader.readAsDataURL(file);
    });
  }

  function loadImageFromBlob(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('圖片無法讀取'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('檔案讀取失敗'));
      reader.readAsDataURL(blob);
    });
  }

  // Grayscale + contrast boost before OCR — Tesseract reads flat, high-contrast
  // text far more reliably than a color photo, especially once JPEG
  // compression has softened small text edges. This only feeds the OCR pass;
  // the original color photo is still what gets uploaded/saved.
  async function preprocessForOcr(blob) {
    const img = await loadImageFromBlob(blob);
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    const contrast = 1.6;
    for (let i = 0; i < data.length; i += 4) {
      const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      const v = Math.max(0, Math.min(255, (gray - 128) * contrast + 128));
      data[i] = data[i + 1] = data[i + 2] = v;
    }
    ctx.putImageData(imageData, 0, 0);
    return new Promise((resolve, reject) => {
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('OCR 前處理失敗')), 'image/png');
    });
  }

  // Pikmin Bloom postcard screenshots put the title (and sometimes a smaller
  // subtitle line) as bold white/light text over a dark gradient in the
  // top-left corner of the frame — everything else (the photo itself, the
  // Pikmin characters, the stamp/logo panel) is pure noise for this purpose
  // and was actively confusing whole-image OCR. Crop to just that corner and
  // threshold it to pure black/white so only the bright title text survives.
  async function cropTitleRegionForOcr(blob) {
    const img = await loadImageFromBlob(blob);
    const cropW = Math.round(img.width * 0.65);
    const cropH = Math.round(img.height * 0.24);
    const canvas = document.createElement('canvas');
    canvas.width = cropW;
    canvas.height = cropH;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, cropW, cropH, 0, 0, cropW, cropH);
    const imageData = ctx.getImageData(0, 0, cropW, cropH);
    const data = imageData.data;
    const threshold = 175;
    for (let i = 0; i < data.length; i += 4) {
      const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      const v = gray >= threshold ? 255 : 0;
      data[i] = data[i + 1] = data[i + 2] = v;
    }
    ctx.putImageData(imageData, 0, 0);
    return new Promise((resolve, reject) => {
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('OCR 前處理失敗')), 'image/png');
    });
  }

  // Recognizing 20+ languages in one combined pass badly confuses visually
  // similar scripts (Chinese/Japanese Kanji, Latin look-alikes, etc.), so
  // Japanese/Korean text was coming back empty or wrong. Instead run a few
  // smaller, script-grouped passes in parallel and keep whichever pass
  // reports the highest confidence — CJK no longer has to compete against
  // 18 unrelated Latin/Cyrillic/Arabic language models in the same pass.
  const OCR_LANG_GROUPS = [
    'chi_tra+chi_sim+jpn+kor+eng',
    'eng+fra+spa+por+deu+ita+nld+swe+ron+pol+dan+fin+msa+tur',
    'ara+rus+hin+ell+swa'
  ];

  // OCR-scans the photo for printed text and fills the name field with the
  // first non-empty recognized line; the field stays editable either way
  // since recognition accuracy depends heavily on the photo's text clarity.
  // Tesseract's confidence score is only meaningful within one language
  // model at a time — comparing raw confidence ACROSS mismatched language
  // groups is unreliable. A Latin-only pass can "confidently" misread
  // Japanese/Korean strokes as garbage Latin letters and beat the actually-
  // correct pass's lower score, which is exactly what was happening.
  // Detecting the dominant script first lets only the matching group run,
  // instead of letting confidence arbitrate across scripts it can't fairly
  // compare.
  function scriptToLangGroup(script) {
    const s = (script || '').toLowerCase();
    if (s.includes('katakana') || s.includes('hiragana') || s.includes('han') || s.includes('japan')) return 'chi_tra+chi_sim+jpn+kor+eng';
    if (s.includes('hangul') || s.includes('korean')) return 'kor+chi_tra+chi_sim+eng';
    if (s.includes('cyrillic')) return 'rus+eng';
    if (s.includes('arabic')) return 'ara+eng';
    if (s.includes('devanagari')) return 'hin+eng';
    if (s.includes('greek')) return 'ell+eng';
    if (s.includes('latin')) return 'eng+fra+spa+por+deu+ita+nld+swe+ron+pol+dan+fin+msa+tur';
    return null;
  }

  async function bestOcrLine(ocrBlob) {
    let detectedGroup = null;
    if (typeof Tesseract.detect === 'function') {
      try {
        const { data } = await Tesseract.detect(ocrBlob);
        detectedGroup = scriptToLangGroup(data && data.script);
      } catch (e) { /* detection unavailable/inconclusive — fall back to trying every group */ }
    }

    const groupsToTry = detectedGroup ? [detectedGroup] : OCR_LANG_GROUPS;
    const results = await Promise.all(
      groupsToTry.map(langs => Tesseract.recognize(ocrBlob, langs).catch(() => null))
    );
    let best = null;
    for (const r of results) {
      if (!r || !r.data) continue;
      const line = (r.data.text || '').split('\n').map(s => s.trim()).find(s => s.length > 0) || '';
      if (!line) continue;
      const score = r.data.confidence || 0;
      if (!best || score > best.score) best = { line, score };
    }
    return best;
  }

  async function scanPostcardName(blob) {
    if (typeof Tesseract === 'undefined') {
      nameOcrStatus.textContent = '(文字辨識元件載入失敗,請自行輸入)';
      return;
    }
    nameOcrStatus.textContent = '辨識文字中...';
    try {
      // Try the Pikmin Bloom title-corner crop first — it's fast and, for
      // that specific layout, far more accurate than scanning the whole photo.
      let best = null;
      try {
        const titleCrop = await cropTitleRegionForOcr(blob);
        best = await bestOcrLine(titleCrop);
      } catch (e) { /* fall through to whole-image OCR below */ }

      if (!best) {
        let ocrBlob = blob;
        try { ocrBlob = await preprocessForOcr(blob); } catch (e) { /* fall back to the original color photo */ }
        best = await bestOcrLine(ocrBlob);
      }

      if (best) {
        nameInput.value = best.line;
        nameOcrStatus.textContent = '(已自動辨識,可自行修改)';
      } else {
        nameOcrStatus.textContent = '(無法辨識出文字,請自行輸入)';
      }
    } catch (err) {
      nameOcrStatus.textContent = '(文字辨識失敗,請自行輸入)';
    }
  }

        await driveUploadPostcard(pendingPhotoBlob, { name, location, pikmin, floral, sent, received, favorite, customTag, coords, notes }, (pct) => {
          uploadProgressBar.style.width = pct + '%';
          formMsg.innerHTML = `<span class="spinner"></span>上傳中... ${pct}%`;
        });
        formMsg.textContent = '已儲存!';
        formMsg.className = 'ok';
      }
      await loadPostcards();
      setTimeout(closeAddModal, 900);
    } catch (err) {
      formMsg.textContent = '儲存失敗: ' + (err.message || err);
      formMsg.className = 'err';
      if (String(err.message).includes('登入已過期')) doForceLogout();
    } finally {
      saveBtn.disabled = false;
      uploadProgress.style.display = 'none';
    }
  });
})();
</script>
</body>
</html>
